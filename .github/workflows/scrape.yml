name: Actualizar precios

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Correr el scraper
        id: scrape
        continue-on-error: true
        env:
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
        run: python scrape.py

      - name: Guardar el resultado
        if: always()
        run: |
          git config user.name  "rcm-bot"
          git config user.email "bot@rentalcommunitymiami.com"
          git add docs/data.json
          git diff --staged --quiet || git commit -m "precios $(date -u +%F)"
          git push

      - name: Keepalive
        if: always()
        run: |
          date -u +%FT%TZ > .keepalive
          git add .keepalive
          git diff --staged --quiet || git commit -m "keepalive"
          git push

      - name: Propagar el fallo
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "Scraper exceeded the failure threshold. Data was still saved."
          exit 1
